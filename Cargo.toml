[package]
name = "tow"
version = "0.4.0"
edition = "2024"
description = "A quick overview tree for unknown or forgotten projects"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
globset = "0.4"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
jiff = "0.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"
terminal_size = "0.4"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
insta = { version = "1", features = ["yaml"] }
